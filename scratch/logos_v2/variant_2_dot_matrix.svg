<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Retro Amber screen background -->
  <rect width="100" height="100" rx="6" fill="#0f0b05" stroke="#2c1e10" stroke-width="2"/>
  
  <!-- Concentric Dot matrix forming a snail shell / spiral -->
  <g fill="#f59e0b" opacity="0.9">
    <!-- Outer ring / shell dots -->
    <circle cx="50" cy="18" r="2.5" />
    <circle cx="68" cy="24" r="2.5" />
    <circle cx="78" cy="38" r="2.5" />
    <circle cx="78" cy="58" r="2.5" />
    <circle cx="68" cy="72" r="2.5" />
    <circle cx="50" cy="78" r="2.5" />
    <circle cx="32" cy="72" r="2.5" />
    <circle cx="22" cy="58" r="2.5" />
    <circle cx="22" cy="38" r="2.5" />
    <circle cx="32" cy="24" r="2.5" />
    <!-- Inner spiral ring dots -->
    <circle cx="50" cy="30" r="2" />
    <circle cx="63" cy="35" r="2" />
    <circle cx="70" cy="48" r="2" />
    <circle cx="63" cy="61" r="2" />
    <circle cx="50" cy="66" r="2" />
    <circle cx="37" cy="61" r="2" />
    <circle cx="30" cy="48" r="2" />
    <!-- Core center dots -->
    <circle cx="50" cy="42" r="1.5" />
    <circle cx="58" cy="50" r="1.5" />
    <circle cx="50" cy="54" r="1.5" />
    
    <!-- Connecting circuit trace lines (representing system buses) -->
    <path d="M 50,18 L 68,24 L 78,38 L 78,58 L 68,72 L 50,78 L 32,72 L 22,58 L 22,38 L 32,24 L 50,30 L 63,35 L 70,48 L 63,61 L 50,66 L 37,61 L 30,48 L 50,42 L 58,50 L 50,54" 
          fill="none" stroke="#f59e0b" stroke-width="0.8" opacity="0.25" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
