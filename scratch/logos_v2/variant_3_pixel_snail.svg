<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Retro Terminal Dark-Gray Background -->
  <rect width="100" height="100" rx="6" fill="#11131a" stroke="#222530" stroke-width="2"/>
  
  <!-- Diagnostic Grid -->
  <defs>
    <pattern id="pixel-grid-50" width="2" height="2" patternUnits="userSpaceOnUse">
      <rect width="2" height="2" fill="none" stroke="#222530" stroke-width="0.3" opacity="0.6" />
    </pattern>
  </defs>
  <rect width="100" height="100" fill="url(#pixel-grid-50)" />
  
  <!-- Outer coordinate ticks for retro diagnostic look -->
  <g stroke="#475569" stroke-width="1" opacity="0.4">
    <line x1="50" y1="2" x2="50" y2="6" />
    <line x1="50" y1="94" x2="50" y2="98" />
    <line x1="2" y1="50" x2="6" y2="50" />
    <line x1="94" y1="50" x2="98" y2="50" />
  </g>

  <!-- Slime Trail (Durable Memory / Signals) -->
  <g stroke="none">
    <!-- Liquid slime trail fading off to the left -->
    <rect x="4" y="58" width="10" height="2" fill="#22d3ee" opacity="0.3" />
    <rect x="8" y="56" width="12" height="2" fill="#22d3ee" opacity="0.5" />
    <rect x="14" y="54" width="6" height="2" fill="#22d3ee" opacity="0.7" />
    
    <!-- Floating memory bits (rising data signals) -->
    <rect x="6" y="52" width="2" height="2" fill="#22d3ee" opacity="0.6" />
    <rect x="12" y="50" width="2" height="2" fill="#22d3ee" opacity="0.8" />
    <rect x="18" y="50" width="2" height="2" fill="#22d3ee" opacity="0.4" />
  </g>

  <!-- 8-Bit Snail Body Layer (Foot & Head) -->
  <g stroke="none">
    <!-- Shadow beneath foot -->
    <rect x="22" y="62" width="56" height="2" fill="#090a0f" />
    <rect x="18" y="60" width="60" height="2" fill="#0f111a" />
    
    <!-- Base Foot (Slate-gray base) -->
    <rect x="20" y="58" width="56" height="2" fill="#475569" />
    <rect x="18" y="56" width="56" height="2" fill="#64748b" />
    
    <!-- Body and Neck -->
    <rect x="64" y="54" width="10" height="2" fill="#64748b" />
    <rect x="66" y="52" width="10" height="2" fill="#64748b" />
    <rect x="68" y="50" width="10" height="2" fill="#64748b" />
    <rect x="70" y="48" width="8" height="2" fill="#94a3b8" />
    <rect x="72" y="46" width="6" height="2" fill="#cbd5e1" />
    <rect x="74" y="44" width="4" height="2" fill="#e2e8f0" />
    
    <!-- Monospace black Eye pixel -->
    <rect x="74" y="48" width="2" height="2" fill="#090d0b" />
    
    <!-- Feelers / Antennae (Agent sensors) -->
    <!-- Left antenna -->
    <rect x="72" y="42" width="2" height="2" fill="#64748b" />
    <rect x="70" y="40" width="2" height="2" fill="#64748b" />
    <rect x="68" y="38" width="2" height="2" fill="#64748b" />
    <rect x="68" y="36" width="2" height="2" fill="#22d3ee" /> <!-- Cyan left sensor -->
    
    <!-- Right antenna -->
    <rect x="76" y="42" width="2" height="2" fill="#64748b" />
    <rect x="78" y="40" width="2" height="2" fill="#64748b" />
    <rect x="80" y="38" width="2" height="2" fill="#64748b" />
    <rect x="80" y="36" width="2" height="2" fill="#22d3ee" /> <!-- Cyan right sensor -->
  </g>

  <!-- 8-Bit Spiral Shell Layer -->
  <g stroke="none">
    <!-- Shell Outer Outline (Dark slate frame) -->
    <rect x="34" y="20" width="22" height="2" fill="#1e293b" />
    <rect x="30" y="22" width="4" height="2" fill="#1e293b" />
    <rect x="56" y="22" width="4" height="2" fill="#1e293b" />
    <rect x="28" y="24" width="2" height="32" fill="#1e293b" />
    <rect x="60" y="24" width="2" height="30" fill="#1e293b" />
    <rect x="30" y="56" width="30" height="2" fill="#1e293b" />
    
    <!-- Shell Shading & Fill (Phosphor Green variations) -->
    <!-- Top inner row -->
    <rect x="34" y="22" width="22" height="2" fill="#166534" />
    <rect x="32" y="24" width="28" height="2" fill="#15803d" />
    
    <!-- Right side fill -->
    <rect x="56" y="26" width="4" height="26" fill="#166534" />
    <rect x="58" y="28" width="2" height="20" fill="#14532d" />
    
    <!-- Left side fill -->
    <rect x="30" y="26" width="4" height="28" fill="#22c55e" />
    <rect x="32" y="28" width="2" height="24" fill="#86efac" />
    
    <!-- Bottom inner row -->
    <rect x="34" y="54" width="22" height="2" fill="#15803d" />
    
    <!-- Inner Spiral Outline Divider -->
    <rect x="36" y="30" width="16" height="2" fill="#1e293b" />
    <rect x="36" y="32" width="2" height="16" fill="#1e293b" />
    <rect x="38" y="48" width="14" height="2" fill="#1e293b" />
    <rect x="50" y="34" width="2" height="14" fill="#1e293b" />
    
    <!-- Inner Spiral Green Fills -->
    <rect x="38" y="32" width="12" height="4" fill="#15803d" />
    <rect x="38" y="36" width="2" height="12" fill="#22c55e" />
    <rect x="40" y="44" width="10" height="4" fill="#166534" />
    
    <!-- Core CPU/Memory Kernel (Center of Spiral) -->
    <rect x="40" y="38" width="8" height="6" fill="#090d0b" />
    <rect x="42" y="40" width="4" height="2" fill="#34d399" /> <!-- Heartbeat pulse -->

    <!-- ATLAS Stage Status LEDs (The Project Pillars) -->
    <!-- 1. Align (Red LED on Left outer shell) -->
    <rect x="30" y="40" width="4" height="2" fill="#ef4444" />
    
    <!-- 2. Trace (Orange LED on Top outer shell) -->
    <rect x="44" y="22" width="4" height="2" fill="#f59e0b" />
    
    <!-- 3. Lay (Green LED on Right outer shell) -->
    <rect x="58" y="34" width="4" height="2" fill="#10b981" />
    
    <!-- 4. Act (Blue LED on Inner spiral wall) -->
    <rect x="48" y="42" width="4" height="2" fill="#3b82f6" />
    
    <!-- 5. Settle (Purple LED on Bottom outer shell) -->
    <rect x="44" y="54" width="4" height="2" fill="#8b5cf6" />
  </g>
  
  <!-- Overlay Scanlines for realistic CRT filter -->
  <rect width="100" height="100" fill="url(#pixel-grid-50)" pointer-events="none" opacity="0.3"/>
</svg>
