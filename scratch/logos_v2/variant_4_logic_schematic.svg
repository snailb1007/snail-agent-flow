<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Schematic blueprint background -->
  <rect width="100" height="100" rx="6" fill="#0c1020" stroke="#1d2a4a" stroke-width="2"/>
  
  <!-- Technical blueprint grid background -->
  <defs>
    <pattern id="schematic-grid-v2" width="10" height="10" patternUnits="userSpaceOnUse">
      <path d="M 10 0 L 0 0 0 10" fill="none" stroke="#1d2a4a" stroke-width="0.5" opacity="0.6" />
    </pattern>
  </defs>
  <rect width="100" height="100" fill="url(#schematic-grid-v2)" />
  
  <!-- Schematic drawing of ATLAS stages -->
  <g stroke="#06b6d4" stroke-width="1.2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Logic blocks for Align, Trace, Lay, Act, Settle -->
    <!-- [A] Align block -->
    <rect x="15" y="20" width="12" height="12" rx="1.5" stroke-width="1.5" />
    <!-- [T] Trace block -->
    <rect x="44" y="20" width="12" height="12" rx="1.5" stroke-width="1.5" />
    <!-- [L] Lay block -->
    <rect x="73" y="20" width="12" height="12" rx="1.5" stroke-width="1.5" />
    <!-- [Act] Act block -->
    <rect x="73" y="60" width="12" height="12" rx="1.5" stroke-width="1.5" />
    <!-- [S] Settle block -->
    <rect x="44" y="60" width="12" height="12" rx="1.5" stroke-width="1.5" />
    
    <!-- Connection trace buses (representing flow logic) -->
    <!-- A -> T -->
    <line x1="27" y1="26" x2="44" y2="26" />
    <polygon points="41,24 44,26 41,28" fill="#06b6d4" stroke="none" />
    
    <!-- T -> L -->
    <line x1="56" y1="26" x2="73" y2="26" />
    <polygon points="70,24 73,26 70,28" fill="#06b6d4" stroke="none" />
    
    <!-- L -> Act -->
    <line x1="79" y1="32" x2="79" y2="60" />
    <polygon points="77,57 79,60 81,57" fill="#06b6d4" stroke="none" />
    
    <!-- Act -> S -->
    <line x1="73" y1="66" x2="56" y2="66" />
    <polygon points="59,64 56,66 59,68" fill="#06b6d4" stroke="none" />
    
    <!-- S -> A (feedback loop) -->
    <path d="M 44,66 L 21,66 L 21,32" />
    <polygon points="19,35 21,32 23,35" fill="#06b6d4" stroke="none" />
    
    <!-- Act -> L feedback loop (dashed path for failing tests) -->
    <path d="M 73,60 Q 60,46 73,26" stroke-dasharray="2,2" opacity="0.8" />
    
    <!-- Schematic glyphs inside logic gates -->
    <!-- A glyph -->
    <path d="M 18,24 L 21,30 M 24,24 L 21,30 M 19.5,28 L 22.5,28" />
    <!-- T glyph -->
    <path d="M 47,24 L 53,24 M 50,24 L 50,30" />
    <!-- L glyph -->
    <path d="M 47,64 L 47,68 L 51,68" opacity="0" /> <!-- (re-positioned L is at 73,20) -->
    <path d="M 76,24 L 76,28 L 80,28" />
    <!-- Act glyph (Play arrow) -->
    <polygon points="77,64 77,68 81,66" fill="#06b6d4" stroke-width="0.5" />
    <!-- S glyph -->
    <path d="M 50,62.5 C 47,62.5 47,65 50,65 C 53,65 53,67.5 50,67.5" />
  </g>
</svg>
