<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Solid deep black background -->
  <rect width="100" height="100" rx="6" fill="#000000" stroke="#333333" stroke-width="2"/>
  
  <!-- High intensity phosphor glow -->
  <defs>
    <filter id="phosphor-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  
  <!-- Vector lines drawn with absolute precision (single width phosphor green) -->
  <g stroke="#00ff66" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#phosphor-glow)">
    <!-- Radial alignment lines (vector scope coordinate grid) -->
    <circle cx="50" cy="50" r="42" stroke="#00ff66" stroke-dasharray="1,8" opacity="0.25" />
    <circle cx="50" cy="50" r="26" stroke="#00ff66" stroke-dasharray="1,6" opacity="0.25" />
    <line x1="50" y1="8" x2="50" y2="92" stroke="#00ff66" stroke-width="0.5" opacity="0.15" />
    <line x1="8" y1="50" x2="92" y2="50" stroke="#00ff66" stroke-width="0.5" opacity="0.15" />

    <!-- Sharp vector golden spiral path representing Snail shell -->
    <path d="M 50,50 L 53,50 L 53,47 L 49,47 L 49,52 L 55,52 L 55,44 L 45,44 L 45,56 L 60,56 L 60,39 L 39,39 L 39,63 L 67,63 L 67,31 L 31,31 L 31,71 L 76,71 L 76,21 Z" />
    
    <!-- Active terminal node pointer -->
    <polygon points="76,21 73,25 79,25" fill="#00ff66" stroke="none" />
  </g>
</svg>
